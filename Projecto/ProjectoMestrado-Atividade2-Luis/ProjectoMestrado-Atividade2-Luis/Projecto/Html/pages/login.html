        <a class="navbar-brand text-dark" href="../pages/Index.html">
          <i class="bi bi-apple"></i>
        </a>

        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar">
          <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title">Menu</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="offcanvas"
              aria-label="Close"
            ></button>
          </div>

          <div class="offcanvas-body">
            <ul class="navbar-nav justify-content-start flex-grow-1 pe-3">
              <li class="nav-item">
                <a
                  class="nav-link nav-link-apple"
                  href="../pages/productsIphones.html"
                  >iPhone</a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link nav-link-apple"
                  href="../pages/productsIpads.html"
                  >iPad</a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link nav-link-apple"
                  href="../pages/productsMacs.html"
                  >Mac</a>
              </li>

              <hr class="d-lg-none" />
              <li class="nav-item d-lg-none">
                <a
                  class="nav-link d-flex align-items-center gap-2"
                  href="../pages/cart.html"
                >
                  <i class="bi bi-box-arrow-in-right"></i> Terminar Sessão
                </a>
              </li>
            </ul>
          </div>
        </div>

        <div class="d-flex gap-4 align-items-center ms-auto">
          <div class="position-relative" id="search-wrapper">
            <div id="search-icon-wrapper">
              <a
                href="javascript:void(0)"
                class="text-dark"
                onclick="toggleSearch()"
              >
                <i class="bi bi-search"></i>
              </a>
            </div>

            <div id="search-active-wrapper" class="d-none search-floating-box">
              <div class="d-flex align-items-center border-bottom pb-2 mb-2">
                <input
                  type="text"
                  id="inputFocus"
                  class="form-control form-control-sm border-0 shadow-none"
                  placeholder="Pesquisar..."
                  onkeyup="filterSearch()"
                />
                <button class="btn btn-sm" onclick="toggleSearch()">
                  <i class="bi bi-x"></i>
                </button>
              </div>

              <ul id="searchResults" class="list-unstyled mb-0">
                <li class="category-item py-1">
                  <a
                    href="../pages/productsIphones.html"
                    class="text-decoration-none text-dark fw-bold"
                    >iPhone</a>
                </li>
                <li class="category-item py-1">
                  <a
                    href="../pages/productsIpads.html"
                    class="text-decoration-none text-dark fw-bold"
                    >iPad</a>
                </li>
                <li class="category-item py-1">
                  <a
                    href="../pages/productsMacs.html"
                    class="text-decoration-none text-dark fw-bold"
                    >Mac</a>
                </li>

          <a href="../pages/cart.html" class="text-dark position-relative">
            <i class="bi bi-cart"></i>
            <span id="cartCount" class="cart-badge">0</span>

            <i class="bi bi-box-arrow-in-right"></i>
          </a>

          <button
            class="navbar-toggler border-0 ms-2 d-lg-none"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#offcanvasNavbar"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>
      </div>
    </nav>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <h2 class="col-8 col-md-12 mx-auto text-center titulo">
          Inicie sessão na Apple Store
        </h2>
      </div>

      <div class="row justify-content-center">
        <div class="col-12 col-md-6 text-center">
          <form class="row g-3 needs-validation" novalidate>
            <div class="row justify-content-center mt-4">
              <div class="col-12 col-md-8 position-relative">
                <div class="mt-2 mb-2 has-validation">
                  <input
                    type="email"
                    class="form-control inputtexto border-3"
                    id="validationEmail"
                    placeholder="Email"
                    required
                  />
                  <div class="invalid-tooltip">Email inválido</div>
                </div>
              </div>
            </div>
            <!--Para a página Principal (index.html)-->
            <div class="row justify-content-center mt-4">
              <div class="col-12 col-md-6">
                <button class="btn btn-primary" type="submit">Seguinte</button>
              </div>
            </div>
          </form>

          <!--Para a página do registo -->
          <div class="d-flex justify-content-center gap-2 mb-3 mt-2">
            <span>Não tem uma conta?</span>
            <a href="../pages/register.html" class="text-decoration-none"
              >Criar Conta <i class="bi bi-arrow-right"></i
            ></a>
          </div>

          <!--Com a conta google (em modal) -->
          <div class="d-grid gap-2 col-12 col-md-6 mx-auto">
            <button
              type="button"
              class="btn btn-outline-dark d-flex align-items-center justify-content-center gap-2"
              data-bs-toggle="modal"
              data-bs-target="#exampleModal"
            >
              <i class="bi bi-google"></i>
              Faça login com Google
            </button>

            <div
              class="modal fade"
              id="exampleModal"
              tabindex="-1"
              aria-labelledby="exampleModalLabel"
              aria-hidden="true"
            >
              <div class="modal-dialog">
                <div class="modal-content text-start">
                  <div class="modal-header border-bottom border-black border-3">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">
                      <i class="bi bi-google me-2"></i>Iniciar Sessão com Google
                    </h1>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                      aria-label="Close"
                    ></button>
                  </div>

                  <div class="modal-body">
                    <form>
                      <div class="mb-3">
                        <label for="email-name" class="form-label fw-bold"
                          >Email:</label
                        >
                        <input
                          type="email"
                          class="form-control border-3"
                          id="email-name"
                        />
                      </div>
                      <div class="mb-3">
                        <label for="password-text" class="form-label fw-bold"
                          >Password:</label
                        >
                        <input
                          type="password"
                          class="form-control border-3"
                          id="password-text"
                        />
                      </div>
                    </form>
                  </div>

                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-secondary"
                      data-bs-dismiss="modal"
                    >
                      Fechar
                    </button>
                    <!--Para página principal-->
                    <button type="button" class="btn btn-primary">
                      Entrar
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <ul class="footer-links">
          <li><a href="../pages/polity.html">Política de privacidade</a></li>
          <li>
            <a href="../pages/termsconditions.html">Termos e Condições</a>
          </li>
          <li><a href="../pages/fqa.html">FQAs</a></li>
          <li><a href="../pages/contacts.html">contactos</a></li>
        </ul>
      </div>
    </footer>

    <script src="../Css/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
