<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Store | Projecto PWD</title>
    <!-- Bootstrap 5 CSS -->
    <link href="../Css/css/styleIndex.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts: Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <!-- presention in external slideshow logic -->
    <script src="../Css/js/slideShow.js" defer></script>
    <script src="../Css/js/helperfuncion.js" defer></script>
    <script src="../Css/js/login.js" defer></script>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-apple">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand text-dark" href="../pages/Index.html"
          ><i class="bi bi-apple"></i
        ></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-center"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link nav-link-apple" href="productsIphones.html"
                >iPhone</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link nav-link-apple" href="#">iPad</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-link-apple" href="#">Mac</a>
            </li>
          </ul>
        </div>
        <div class="d-flex gap-4">
          <a href="#" class="text-dark"><i class="bi bi-search"></i></a>
          <a href="cart.html" class="text-dark position-relative">
            <i class="bi bi-cart"></i>
            <span id="cartCount" class="cart-badge">0</span>
          </a>
          <a href="cart.html" class="text-dark"
            ><i class="bi bi-box-arrow-in-right"></i
          ></a>
        </div>
      </div>
    </nav>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <h2 class="col-8 col-md-12 mx-auto text-center titulo">
          Inicie sessão na Apple Store
        </h2>
      </div>

      <div class="row justify-content-center">
        <div class="col-12 col-md-6 text-center">
          <form class="row g-3 needs-validation" novalidate>
            <div class="row justify-content-center mt-4">
              <div class="col-12 col-md-8 position-relative">
                <div class="mt-2 mb-2 has-validation">
                  <input
                    type="email"
                    class="form-control inputtexto border-3"
                    id="validationEmail"
                    placeholder="Email"
                    required
                  />
                  <div class="invalid-tooltip">Email inválido</div>
                </div>
              </div>
            </div>
            <!--Para a página Principal (index.html)-->
            <div class="row justify-content-center mt-4">
              <div class="col-12 col-md-6">
                <button class="btn btn-primary" type="submit">Seguinte</button>
              </div>
            </div>
          </form>

          <!--Para a página do registo -->
          <div class="d-flex justify-content-center gap-2 mb-3 mt-2">
            <span>Não tem uma conta?</span>
            <a href="../pages/register.html" class="text-decoration-none"
              >Criar Conta <i class="bi bi-arrow-right"></i
            ></a>
          </div>

          <!--Com a conta google (em modal) -->
          <div class="d-grid gap-2 col-12 col-md-6 mx-auto">
            <button
              type="button"
              class="btn btn-outline-dark d-flex align-items-center justify-content-center gap-2"
              data-bs-toggle="modal"
              data-bs-target="#exampleModal"
            >
              <i class="bi bi-google"></i>
              Faça login com Google
            </button>

            <div
              class="modal fade"
              id="exampleModal"
              tabindex="-1"
              aria-labelledby="exampleModalLabel"
              aria-hidden="true"
            >
              <div class="modal-dialog">
                <div class="modal-content text-start">
                  <div class="modal-header border-bottom border-black border-3">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">
                      <i class="bi bi-google me-2"></i>Iniciar Sessão com Google
                    </h1>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                      aria-label="Close"
                    ></button>
                  </div>

                  <div class="modal-body">
                    <form>
                      <div class="mb-3">
                        <label for="email-name" class="form-label fw-bold"
                          >Email:</label
                        >
                        <input
                          type="email"
                          class="form-control border-3"
                          id="email-name"
                        />
                      </div>
                      <div class="mb-3">
                        <label for="password-text" class="form-label fw-bold"
                          >Password:</label
                        >
                        <input
                          type="password"
                          class="form-control border-3"
                          id="password-text"
                        />
                      </div>
                    </form>
                  </div>

                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-secondary"
                      data-bs-dismiss="modal"
                    >
                      Fechar
                    </button>
                    <!--Para página principal-->
                    <button type="button" class="btn btn-primary">
                      Entrar
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <ul class="footer-links">
          <li><a href="../pages/polity.html">Política de privacidade</a></li>
          <li>
            <a href="../pages/termsconditions.html">Termos e Condições</a>
          </li>
          <li><a href="../pages/fqa.html">FQAs</a></li>
          <li><a href="../pages/contacts.html">contactos</a></li>
        </ul>
      </div>
    </footer>

    <script src="../Css/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
