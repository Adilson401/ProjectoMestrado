  <head>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts: Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <!-- presention in external slideshow logic -->
    <script src="../Css/js/slideShow.js" defer></script>
    <script src="../Css/js/helperfuncion.js" defer></script>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-apple">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand text-dark" href="../pages/Index.html"
          ><i class="bi bi-apple"></i
        ></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-center"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link nav-link-apple" href="productsIphones.html"
                >iPhone</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link nav-link-apple" href="#">iPad</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-link-apple" href="#">Mac</a>
            </li>
          </ul>
        </div>
        <div class="d-flex gap-4">
          <a href="#" class="text-dark"><i class="bi bi-search"></i></a>
          <a href="cart.html" class="text-dark position-relative">
            <i class="bi bi-cart"></i>
            <span id="cartCount" class="cart-badge">0</span>
          </a>
          <a href="cart.html" class="text-dark"
            ><i class="bi bi-box-arrow-in-right"></i
          ></a>
        </div>
      </div>
    </nav>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <h2 class="col-8 col-md-12 mx-auto text-center titulo">
          Registar Conta Apple Store
        </h2>
      </div>

      <div class="row justify-content-md-center">
        <!--Para a Pagina login -->
        <div class="d-flex justify-content-center gap-2 mb-3 mt-2">
          <span>Já tens Conta?</span>
          <a href="../pages/login.html" class="text-decoration-none">
            Login <i class="bi bi-arrow-right"></i>
          </a>
        </div>

        <div class="row justify-content-center">
          <div class="col-12 col-md-6 text-center">
            <form class="row g-3">
              <div class="row justify-content-center mt-4">
                <div class="col-12 col-md-8">
                  <div class="d-flex gap-2 mt-2 mb-2">
                    <div>
                      <input
                        type="text"
                        class="form-control border-3"
                        placeholder="Nome Próprio"
                        pattern="[a-zA-ZÀ-ú\s]+"
                        name="nome"
                        required
                      />
                    </div>
                    <div>
                      <input
                        type="text"
                        class="form-control border-3"
                        placeholder="Sobrenome"
                        name="sobrenome"
                        required
                      />
                    </div>
                  </div>
                  <div class="mt-2 mb-2">
                    <input
                      type="email"
                      class="form-control border-3"
                      placeholder="Email"
                      name="email"
                      required
                    />
                  </div>

                  <!-- Para confirmar a palavra passe se são iguais-->
                  <div>
                    <div class="mt-2 mb-2">
                      <input
                        type="password"
                        class="form-control border-3"
                        id="inputPassword"
                        placeholder="Palavra-passe"
                        minlength="8"
                        maxlength="16"
                        required
                      />
                    </div>

                    <div class="mt-2 mb-2">
                      <input
                        type="password"
                        class="form-control border-3"
                        id="inputConfirmPassword"
                        placeholder="Confirme a Palavra-passe"
                        minlength="8"
                        maxlength="16"
                        required
                      />
                      <div class="invalid-feedback">
                        As palavras-passe não coincidem.
                      </div>
                    </div>
                  </div>

                  <div
                    class="d-flex justify-content-between align-items-start mt-2 mb-2"
                  >
                    <div class="form-check mt-2">
                      <input
                        class="form-check-input border-3"
                        type="checkbox"
                        id="invalidCheck"
                        required
                      />
                      <label class="form-check-label" for="invalidCheck">
                        Aceite os
                        <a
                          href="../pages/termsconditions.html"
                          class="text-decoration-none"
                          >termos e condições</a
                        >.
                      </label>
                      <div class="invalid-feedback">
                        Tens de aceitar antes de submeter.
                      </div>
                    </div>

                    <!-- Para Pagina principal / login -->
                    <button
                      type="submit"
                      class="btn btn-outline-primary rounded-pill mt-2 px-4"
                    >
                      Registar
                    </button>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <ul class="footer-links">
          <li><a href="../pages/polity.html">Política de privacidade</a></li>
          <li>
            <a href="../pages/termsconditions.html">Termos e Condições</a>
          </li>
          <li><a href="../pages/fqa.html">FQAs</a></li>
          <li><a href="../pages/contacts.html">contactos</a></li>
        </ul>
      </div>
    </footer>

    <script src="../Css/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
