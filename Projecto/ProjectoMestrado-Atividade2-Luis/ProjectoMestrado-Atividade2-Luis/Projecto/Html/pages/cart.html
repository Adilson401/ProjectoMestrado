<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - Apple Store | Projecto PWD</title>
    <!-- Bootstrap 5 CSS -->
    <link href="../Css/css/styleIndex.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="../Css/js/helperfuncion.js" defer></script>
</head>
<body>

    <!-- Navbar (menu) -->
    <nav class="navbar navbar-expand-lg navbar-apple">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand text-dark" href="Index.html"><i class="bi bi-apple"></i></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link nav-link-apple" href="Index.html">iPhone</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-apple" href="Index.html">iPad</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-apple" href="Index.html">Mac</a></li>
                </ul>
            </div>
            <div class="d-flex gap-4">
                <a href="#" class="text-dark"><i class="bi bi-search"></i></a>
                <a href="cart.html" class="text-dark position-relative">
                    <i class="bi bi-cart"></i>
                    <span id="cartCount" class="cart-badge">0</span>
                </a>
                <a href="cart.html" class="text-dark"><i class="bi bi-box-arrow-in-right"></i></a>
            </div>
        </div>
    </nav>

    <!-- Cart header -->
    <div class="container mt-4 mb-4">
        <div class="d-flex align-items-center gap-3 mb-4">
            <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm rounded-circle d-flex align-items-center justify-content-center" style="width:40px;height:40px;font-size:20px;"><i class="bi bi-arrow-left"></i></a>
            <h1 class="section-title mb-0">Carrinho</h1>
        </div>
    </div>

    <!-- Cart content -->
    <div class="container mt-5">
        <div class="row">
            <div class="col-lg-8">
                <!-- Cart table -->
                <table class="table table-borderless cart-table">
                    <thead>
                        <tr>
                            <th></th>
                            <th>PRODUTO</th>
                            <th>QUANTIDADE</th>
                            <th>PREÇO</th>
                        </tr>
                    </thead>
                    <tbody id="cartItemsContainer">
                        <!-- Items will be loaded dynamically here -->
                    </tbody>
                </table>
            </div>

            <!-- Summary box -->
            <div class="col-lg-4">
                <div class="summary-box">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="subtotal">0,00 €</span>
                    </div>
                    <div class="summary-row">
                        <span>Portes de envio</span>
                        <span>Grátis</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total a pagar</span>
                        <span id="totalPrice">0,00 €</span>
                    </div>
                </div>

                <!-- Payment button -->
                <div class="d-flex justify-content-end">
                    <button class="btn btn-outline-primary btn-payment">Pagamento <i class="bi bi-credit-card"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <ul class="footer-links">
                <li><a href="#">Política de privacidade</a></li>
                <li><a href="#">Termos e Condições</a></li>
                <li><a href="#">FQAs</a></li>
                <li><a href="#">contactos</a></li>
            </ul>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
